<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Blazor DevTools Panel</title>
    <link rel="stylesheet" href="panel.css">
    <link rel="stylesheet" href="timeline-panel.css">
</head>
<body>
    <div class="panel-container">
        <!-- Top Tab Bar -->
        <div class="tab-bar">
            <button class="tab active" data-tab="components">
                <span class="tab-icon">🧩</span>
                Components
            </button>
            <button class="tab" data-tab="timeline">
                <span class="tab-icon">⏱</span>
                Timeline
            </button>
            <div class="tab-spacer"></div>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </div>
        
        <!-- ═══════════════════════════════════════════════════════════════════════
             COMPONENTS TAB
             ═══════════════════════════════════════════════════════════════════════ -->
        <div class="tab-content active" data-tab="components">
            <!-- Toolbar -->
            <div class="toolbar">
                <button id="refresh-btn" title="Refresh component list">
                    <span class="icon">↻</span>
                </button>
                <button id="picker-btn" title="Select component in page">
                    <span class="icon">⊙</span>
                </button>
                <button id="highlight-btn" title="Highlight updates: flash components on the page when they re-render">
                    <span class="icon">✨</span>
                </button>
                <button id="filter-btn" title="Hide framework components (Router, RouteView, LayoutView, CascadingValue, …)">
                    <span class="icon">⊘</span>
                </button>
                <input id="tree-search" type="search" placeholder="Search components…" spellcheck="false" autocomplete="off" />
                <div class="spacer"></div>
                <span class="component-count" id="component-count"></span>
            </div>
            
            <!-- Main content -->
            <div class="main-content">
                <!-- Component tree panel -->
                <div class="tree-panel">
                    <div class="panel-header">
                        <span class="panel-title">Components</span>
                    </div>
                    <div class="tree-content" id="component-tree">
                        <div class="loading">Loading components...</div>
                    </div>
                </div>
                
                <!-- Details panel -->
                <div class="details-panel">
                    <div class="panel-header">
                        <span class="panel-title">Details</span>
                    </div>
                    <div class="details-content" id="component-details">
                        <div class="no-selection">Select a component to view details</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- ═══════════════════════════════════════════════════════════════════════
             TIMELINE TAB
             ═══════════════════════════════════════════════════════════════════════ -->
        <div class="tab-content" data-tab="timeline">
            <!-- Timeline Toolbar -->
            <div class="timeline-toolbar">
                <div class="timeline-controls">
                    <button id="timeline-record-btn" title="Start recording">
                        <span class="icon">⏺</span>
                        Record
                    </button>
                    <button id="timeline-stop-btn" title="Stop recording" disabled>
                        <span class="icon">⏹</span>
                        Stop
                    </button>
                    <button id="timeline-clear-btn" title="Clear recording" disabled>
                        <span class="icon">🗑</span>
                        Clear
                    </button>
                </div>
                <div id="timeline-stats">
                    <span class="stats-empty">Click record to start profiling</span>
                </div>
            </div>
            
            <!-- View Tabs -->
            <div class="timeline-view-tabs">
                <button class="timeline-view-tab active" data-view="events">Events</button>
                <button class="timeline-view-tab" data-view="ranked">Ranked</button>
                <button class="timeline-view-tab" data-view="flamegraph">Flamegraph</button>
                <button class="timeline-view-tab" data-view="commits" title="One bar per burst of rendering — click a bar to see what rendered in that commit and for how long">Commits</button>
            </div>
            
            <!-- Timeline Main Content -->
            <div class="timeline-main">
                <div id="timeline-content">
                    <div class="timeline-empty">
                        <div class="empty-icon">⏱</div>
                        <div class="empty-title">No events recorded</div>
                        <div class="empty-hint">Click the record button to start profiling</div>
                    </div>
                </div>
                <div id="timeline-details">
                    <div class="details-empty">Select an event to view details</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="panel.js"></script>
</body>
</html>
